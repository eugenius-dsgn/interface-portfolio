<!DOCTYPE html>
<html lang="ru">
  <head>
    <title>Евгений Смирнов</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles/settings.css" />
    <link rel="stylesheet" href="styles/tokens/palette.css" />
    <link rel="stylesheet" href="styles/tokens/colors.css" />
    <link rel="stylesheet" href="styles/tokens/scales.css" />
    <link rel="stylesheet" href="styles/layout.css" />
    <link rel="stylesheet" href="styles/style.css" />
    <link rel="stylesheet" href="styles/interactive.css" />
  </head>
  <body>
    <div class="overlay loading-screen dark">
      <div class="v-spacer l"></div>
      <div id="status-wrapper">
        <div id="statuses-belt"> 
        </div>
      </div>  
      <div class="progress-bar">
        <div class="progress-indicator"></div>
      </div>
    </div>
    <div id="introduction" class="wrapper ultra-wide">
      <figure id="introduction-video" class="video-player">
        <video class="long" playsinline>
          <source src="assets/video/about.webm" type="video/webm">
          <source src="assets/video/about.mp4" type="video/mp4">
          <p>
            Видео обо мне не загрузилось. Можете посмотреть его на
            <a href="https://youtu.be/fUEUgPn6CEM">YouTube</a>.
          </p>  
        </video>
        <video class="loop" muted autoplay loop playsinline poster="assets/images/LoopPreview.avif">
          <source src="assets/video/aboutLoop.webm" type="video/webm">
          <source src="assets/video/aboutLoop.mp4" type="video/mp4">
          <p>
            Видео обо мне не загрузилось. Можете посмотреть его на
            <a href="https://youtu.be/fUEUgPn6CEM">YouTube</a>.
          </p>  
        </video>
        <div class="video-controls">
          <button type="button" class="video-play-toggle" aria-label="Play">
            <div class="button-icons-wrapper">
            <svg id="play" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="1 0 64 64"><path fill="#fff" d="M20.935 47.023V16.577q0-1.06.68-1.674a2.3 2.3 0 0 1 1.584-.613 2.6 2.6 0 0 1 1.23.313L48.384 29.91q.523.366.79.83.27.463.27 1.06 0 .598-.27 1.06-.267.465-.79.83L24.43 48.997q-.314.164-.621.23a3 3 0 0 1-.611.067q-.904 0-1.583-.601-.68-.602-.68-1.67"/></svg>
            <svg id="pause" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 64 64"><path fill="#fff" d="M41.362 51.4q-1.879 0-3.216-1.339t-1.337-3.219V17.158q0-1.88 1.337-3.22 1.338-1.338 3.216-1.338h3.667q1.878 0 3.212 1.339 1.334 1.34 1.334 3.219v29.684q0 1.88-1.334 3.22-1.334 1.338-3.213 1.338zm-22.385 0q-1.878 0-3.215-1.339t-1.337-3.219V17.158q0-1.88 1.337-3.22Q17.1 12.6 18.977 12.6h3.667q1.88 0 3.213 1.339 1.335 1.34 1.335 3.219v29.684q0 1.88-1.335 3.22-1.334 1.338-3.213 1.338z"/></svg>
            </div>
          </button>
          <p></p>
        </div>
      </figure>
    </div>
    <div class="v-spacer xl"></div>
    <div class="wrapper"> 
      <div class="tablist" role="tablist"> 
        <button id="hr" type="button" role="tab" class="text tab" aria-label="Заголовок для эйчара" aria-selected="true">Для эйчара</button>
        <button id="design-lead" type="button" role="tab" class="text tab" aria-label="Заголовок для дизайн-лида" aria-selected="false">дизайн-лида</button>
        <button id="head-manager" type="button" role="tab" class="text tab" aria-label="Заголовок для руководителя" aria-selected="false">руководителя</button>
      </div>
      <div class="v-spacer s"></div>
      <p id="introduction-display" class="display"></p>
    </div>
    <script src="scripts/loadingScreen.js"></script>
    <script src="scripts/videoPlayer.js"></script>
    <script src="scripts/main.js"></script>
  </body>
</html>
